name: COR-228 hook fix

on:
  push:
    branches:
      - cor-228-map-context-moment

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cor-228-map-context-moment
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Stabilize map context dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/timeline/screens/quick-moment-screen.tsx")
          text = path.read_text()

          marker = "  const tripAvailable = trip !== null;\n"
          addition = (
              "  const mapContextLabel = mapContext?.label ?? null;\n"
              "  const mapContextLatitude = mapContext?.latitude ?? null;\n"
              "  const mapContextLongitude = mapContext?.longitude ?? null;\n"
          )
          if addition not in text:
              if text.count(marker) != 1:
                  raise SystemExit("tripAvailable marker missing")
              text = text.replace(marker, marker + addition, 1)

          text = text.replace(
              "          if (mapContext) {",
              "          if (\n            mapContextLabel !== null &&\n            mapContextLatitude !== null &&\n            mapContextLongitude !== null\n          ) {",
          )
          text = text.replace("title: mapContext.label,", "title: mapContextLabel,")
          text = text.replace("latitude: mapContext.latitude,", "latitude: mapContextLatitude,")
          text = text.replace("longitude: mapContext.longitude,", "longitude: mapContextLongitude,")
          text = text.replace("setLocationLabel(mapContext.label);", "setLocationLabel(mapContextLabel);")
          text = text.replace("    mapContext?.label,", "    mapContextLabel,")
          text = text.replace("    mapContext?.latitude,", "    mapContextLatitude,")
          text = text.replace("    mapContext?.longitude,", "    mapContextLongitude,")

          path.write_text(text)
          PY
      - name: Format COR-228 files
        run: pnpm exec prettier --write app/'(tabs)'/trips/'[tripId]'/moment.tsx src/features/map/map-terrain-actions.tsx src/features/timeline/map-moment-context.ts src/features/timeline/screens/quick-moment-screen.tsx tests/cor-228-map-context-moment.test.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/'(tabs)'/trips/'[tripId]'/moment.tsx src/features/map/map-terrain-actions.tsx src/features/timeline/map-moment-context.ts src/features/timeline/screens/quick-moment-screen.tsx tests/cor-228-map-context-moment.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: stabilize and format COR-228 map context"
          git push origin HEAD:cor-228-map-context-moment
