name: COR-147E Hardening

on:
  push:
    branches:
      - cor-147e-offline-session-restore
    paths:
      - .github/workflows/cor-147e-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Harden offline restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/providers/auth-provider.tsx')
          content = path.read_text()
          old = '''      if (nextState === "anonymous") {
                setUser(null);
                resetBiometricRuntimeState();
              }'''
          new = '''      if (nextState !== "authenticated") {
                setUser(null);
              }

              if (nextState === "anonymous") {
                resetBiometricRuntimeState();
              }'''
          if old not in content:
              raise SystemExit('Expected applyRestoreState block not found')
          path.write_text(content.replace(old, new, 1))
          PY
          pnpm exec prettier src/providers/auth-provider.tsx tests/cor-147-offline-trips.test.mjs tests/cor-147-offline-session.test.mjs tests/cor-135-auth-flow.test.mjs --write

      - name: Commit hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/providers/auth-provider.tsx tests/cor-147-offline-trips.test.mjs tests/cor-147-offline-session.test.mjs tests/cor-135-auth-flow.test.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "COR-147E — harden offline identity restore"
          git push origin HEAD:cor-147e-offline-session-restore
