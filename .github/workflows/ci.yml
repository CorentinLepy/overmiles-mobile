name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Persist COR-58 dependency lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'cor-58-biometric-local-lock'
        run: |
          pnpm add expo-local-authentication@~57.0.2 --save-prod --lockfile-only
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "COR-58 lockfile already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build(cor-58): add Expo local authentication"
          git push origin HEAD:cor-58-biometric-local-lock

      - name: Verify repository
        run: pnpm verify

      # Expo can recommend patch releases before they pass our pnpm minimum-release-age policy.
      # Keep this visible as an advisory signal; frozen install, supply-chain policy and Expo Doctor
      # remain blocking gates.
      - name: Report Expo dependency compatibility
        continue-on-error: true
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor
