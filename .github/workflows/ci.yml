name: Mobile CI

on:
  # Keep the PR workflow unconditional: COR-180 will require `Mobile CI / quality`,
  # and GitHub leaves required checks pending when a workflow is skipped by path filters.
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Commit COR-201 lockfile and restore CI
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cor-201-native-photo-capture' }}
        run: |
          git fetch --depth=1 origin cor-147-offline-sync-security-integration
          git show FETCH_HEAD:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add pnpm-lock.yaml .github/workflows/ci.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "COR-201 — Lock ImagePicker dependency and restore CI"
          git push origin HEAD:cor-201-native-photo-capture

      - name: Verify repository
        run: pnpm verify

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor

      - name: Report Expo dependency compatibility
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx expo install --check

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir .expo-ci/ios --clear

      - name: Bundle Android
        run: npx expo export --platform android --output-dir .expo-ci/android --clear

      - name: Validate Android native prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Validate iOS native prebuild
        run: npx expo prebuild --platform ios --no-install --clean
