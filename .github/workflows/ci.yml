name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose COR-58 Prettier diff
        run: |
          pnpm exec prettier src/lib/security/biometric-lock.ts tests/cor-58-biometric-lock.test.mjs --write
          git diff -- src/lib/security/biometric-lock.ts tests/cor-58-biometric-lock.test.mjs
          git checkout -- src/lib/security/biometric-lock.ts tests/cor-58-biometric-lock.test.mjs

      - name: Verify repository
        run: pnpm verify

      # Expo can recommend patch releases before they pass our pnpm minimum-release-age policy.
      # Keep this visible as an advisory signal; frozen install, supply-chain policy and Expo Doctor
      # remain blocking gates.
      - name: Report Expo dependency compatibility
        continue-on-error: true
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor
