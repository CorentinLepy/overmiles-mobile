name: Mobile CI

on:
  # Keep the PR workflow unconditional: COR-180 will require `Mobile CI / quality`,
  # and GitHub leaves required checks pending when a workflow is skipped by path filters.
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose Prettier diff for COR-198
        run: |
          pnpm prettier --write \
            src/features/offline-companion/prefetch-provider.tsx \
            tests/cor-194-companion-prefetch.test.mjs \
            tests/cor-198-offline-availability.test.mjs
          git diff -- \
            src/features/offline-companion/prefetch-provider.tsx \
            tests/cor-194-companion-prefetch.test.mjs \
            tests/cor-198-offline-availability.test.mjs
          exit 1

      - name: Verify repository
        run: pnpm verify

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor

      - name: Report Expo dependency compatibility
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx expo install --check

      - name: Bundle iOS
        run: npx expo export --platform ios --output-dir .expo-ci/ios --clear

      - name: Bundle Android
        run: npx expo export --platform android --output-dir .expo-ci/android --clear

      - name: Validate Android native prebuild
        run: npx expo prebuild --platform android --no-install --clean

      - name: Validate iOS native prebuild
        run: npx expo prebuild --platform ios --no-install --clean
