name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout COR-56 maintenance branch
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cor-56-offline-storage-foundation' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || github.head_ref != 'cor-56-offline-storage-foundation' }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh COR-56 lockfile only
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cor-56-offline-storage-foundation' }}
        run: |
          pnpm install --no-frozen-lockfile
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "overmiles-ci"
            git config user.email "actions@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "COR-56 refresh encrypted-storage lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      # Expo can recommend patch releases before they pass our pnpm minimum-release-age policy.
      # Keep this visible as an advisory signal; frozen install, supply-chain policy and Expo Doctor
      # remain blocking gates.
      - name: Report Expo dependency compatibility
        continue-on-error: true
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor
