name: Mobile CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: maintenance/expo57-patch-alignment

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install current baseline
        run: pnpm install --frozen-lockfile

      - name: Generate COR-199 Expo patch alignment
        run: |
          npx expo install --fix
          npx expo install expo-file-system
          pnpm exec prettier --write package.json
          git config user.name "LaPauseCafé"
          git config user.email "42358698+CorentinLepy@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Expo patch baseline is already aligned."
            exit 0
          fi
          git commit -m "COR-199 — Align Expo 57 patch baseline after COR-201"
          git push origin HEAD:maintenance/expo57-patch-alignment
