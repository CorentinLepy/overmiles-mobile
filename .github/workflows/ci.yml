name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout maintenance branch
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'cor-134-mobile-appshell-foundation' || github.head_ref == 'cor-56-offline-storage-foundation') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || (github.head_ref != 'cor-134-mobile-appshell-foundation' && github.head_ref != 'cor-56-offline-storage-foundation') }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh Expo dependencies and lockfile
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'cor-134-mobile-appshell-foundation' || github.head_ref == 'cor-56-offline-storage-foundation') }}
        run: |
          pnpm install --no-frozen-lockfile
          npx expo install --fix
          if ! git diff --quiet -- package.json pnpm-lock.yaml; then
            git config user.name "overmiles-ci"
            git config user.email "actions@users.noreply.github.com"
            git add package.json pnpm-lock.yaml
            git commit -m "chore: align Expo SDK 57 dependencies"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify repository
        run: pnpm verify

      - name: Verify Expo dependency compatibility
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor
