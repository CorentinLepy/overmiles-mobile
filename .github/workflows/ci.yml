name: Mobile CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout formatting maintenance branch
        if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'cor-135-mobile-auth-flow' || github.head_ref == 'cor-56-offline-storage-foundation') }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout
        if: ${{ github.event_name != 'pull_request' || (github.head_ref != 'cor-135-mobile-auth-flow' && github.head_ref != 'cor-56-offline-storage-foundation') }}
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format COR-135 auth files
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cor-135-mobile-auth-flow' }}
        run: |
          pnpm exec prettier --write \
            src/features/auth/screens/login-screen.tsx \
            src/features/auth/screens/profile-account-screen.tsx \
            src/providers/auth-provider.tsx \
            tests/cor-135-auth-flow.test.mjs
          if ! git diff --quiet -- \
            src/features/auth/screens/login-screen.tsx \
            src/features/auth/screens/profile-account-screen.tsx \
            src/providers/auth-provider.tsx \
            tests/cor-135-auth-flow.test.mjs; then
            git config user.name "overmiles-ci"
            git config user.email "actions@users.noreply.github.com"
            git add \
              src/features/auth/screens/login-screen.tsx \
              src/features/auth/screens/profile-account-screen.tsx \
              src/providers/auth-provider.tsx \
              tests/cor-135-auth-flow.test.mjs
            git commit -m "COR-135 format native auth flow"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Format COR-56 storage file
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'cor-56-offline-storage-foundation' }}
        run: |
          pnpm exec prettier --write src/lib/storage/database-key-store.ts
          if ! git diff --quiet -- src/lib/storage/database-key-store.ts; then
            git config user.name "overmiles-ci"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/storage/database-key-store.ts
            git commit -m "COR-56 format encrypted storage key adapter"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Verify repository
        run: pnpm verify

      # Expo can recommend patch releases before they pass our pnpm minimum-release-age policy.
      # Keep this visible as an advisory signal; frozen install, supply-chain policy and Expo Doctor
      # remain blocking gates.
      - name: Report Expo dependency compatibility
        continue-on-error: true
        run: npx expo install --check

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Run Expo Doctor
        run: pnpm doctor
