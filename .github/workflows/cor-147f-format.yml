name: COR-147F Prettier

on:
  push:
    branches:
      - cor-147f-offline-map-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cor-147f-offline-map-cache
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/features/map/local-map-store.ts tests/cor-147-offline-map.test.mjs --write
      - name: Commit formatted files and remove helper
        shell: bash
        run: |
          rm .github/workflows/cor-147f-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/map/local-map-store.ts tests/cor-147-offline-map.test.mjs .github/workflows/cor-147f-format.yml
          git diff --cached --quiet && exit 0
          git commit -m "COR-147F — apply Prettier to offline Map cache"
          git push
