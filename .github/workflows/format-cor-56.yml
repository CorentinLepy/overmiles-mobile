name: COR-56 Formatter

on:
  push:
    branches:
      - cor-56-offline-storage-foundation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format validated encrypted-storage adapter
        run: |
          pnpm exec prettier --write src/lib/storage/database-key-store.ts
          if ! git diff --quiet -- src/lib/storage/database-key-store.ts; then
            git config user.name "overmiles-ci"
            git config user.email "actions@users.noreply.github.com"
            git add src/lib/storage/database-key-store.ts
            git commit -m "COR-56 format encrypted storage key adapter"
            git push origin HEAD:cor-56-offline-storage-foundation
          fi
