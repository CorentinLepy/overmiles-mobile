name: COR-225 exact formatting

on:
  push:
    branches:
      - cor-225-map-current-trip-focus

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cor-225-map-current-trip-focus
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format COR-225 files
        run: pnpm exec prettier --write src/features/map/screens/map-screen.tsx tests/cor-225-map-current-trip-focus.test.mjs
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/map/screens/map-screen.tsx tests/cor-225-map-current-trip-focus.test.mjs
          git commit -m "style: format COR-225 with repository prettier"
          git push origin HEAD:cor-225-map-current-trip-focus
