name: COR-147F Format SQLCipher transaction fix

on:
  push:
    branches:
      - cor-147f-offline-map-cache

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cor-147f-offline-map-cache
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier src/features/map/local-map-store.ts tests/cor-147-offline-map.test.mjs --write
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/map/local-map-store.ts tests/cor-147-offline-map.test.mjs
          git commit -m 'COR-147F — apply Prettier to SQLCipher transaction fix'
          git push
      - run: |
          git rm .github/workflows/cor-147f-format2.yml
          git commit -m 'chore: remove temporary COR-147F formatter'
          git push
