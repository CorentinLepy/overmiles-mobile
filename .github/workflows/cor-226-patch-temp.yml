name: COR-226 map integration

on:
  push:
    branches:
      - cor-226-map-point-distance

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cor-226-map-point-distance
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.20.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Integrate distance into selected point card
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/map/screens/map-screen.tsx")
          text = path.read_text()

          replacements = [
              (
                  'import { MapCurrentTripFocus } from "../map-current-trip-focus";\nimport { createVisitedPointsFeatureCollection } from "../map-geojson";',
                  'import { MapCurrentTripFocus } from "../map-current-trip-focus";\nimport { createVisitedPointsFeatureCollection } from "../map-geojson";\nimport { MapPointDistance } from "../map-point-distance";',
              ),
              (
                  '          point={selectedPoint}\n          isOffline={state.status === "offline"}',
                  '          point={selectedPoint}\n          isOffline={state.status === "offline"}\n          showUserDistance={isUserLocationEnabled}',
              ),
              (
                  '  point,\n  isOffline,\n  onClose,\n  bottomInset,',
                  '  point,\n  isOffline,\n  showUserDistance,\n  onClose,\n  bottomInset,',
              ),
              (
                  '  point: TripMapPoint;\n  isOffline: boolean;\n  onClose: () => void;',
                  '  point: TripMapPoint;\n  isOffline: boolean;\n  showUserDistance: boolean;\n  onClose: () => void;',
              ),
              (
                  '      {point.occurredAt ? (',
                  '      {showUserDistance ? <MapPointDistance point={point} /> : null}\n      {point.occurredAt ? (',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Format COR-226 files
        run: pnpm exec prettier --write src/features/map/screens/map-screen.tsx src/features/map/map-distance.ts src/features/map/map-point-distance.tsx tests/cor-226-map-point-distance.test.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/map/screens/map-screen.tsx src/features/map/map-distance.ts src/features/map/map-point-distance.tsx tests/cor-226-map-point-distance.test.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: integrate COR-226 local map distance"
          git push origin HEAD:cor-226-map-point-distance
