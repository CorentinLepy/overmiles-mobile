name: COR-104 format release readiness

on:
  push:
    branches:
      - cor-104-release-readiness-foundation
    paths:
      - .github/workflows/cor-104-prettier.yml
      - docs/cor-104-store-release-readiness.md
      - tests/cor-104-release-readiness.test.mjs

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: cor-104-release-readiness-foundation

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format release readiness files
        run: pnpm exec prettier docs/cor-104-store-release-readiness.md tests/cor-104-release-readiness.test.mjs --write

      - name: Commit formatted files
        run: |
          git diff --exit-code -- docs/cor-104-store-release-readiness.md tests/cor-104-release-readiness.test.mjs && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cor-104-store-release-readiness.md tests/cor-104-release-readiness.test.mjs
          git commit -m "style(cor-104): format release readiness files"
          git push origin HEAD:cor-104-release-readiness-foundation
