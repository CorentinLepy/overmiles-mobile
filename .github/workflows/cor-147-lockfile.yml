name: COR-147 Lockfile Regeneration

on:
  push:
    branches:
      - cor-147a-sqlcipher-port
    paths:
      - .github/workflows/cor-147-lockfile.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ github.event.head_commit.message == 'ci(storage): regenerate pnpm lockfile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit generated lockfile through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          lock_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml?ref=${GITHUB_REF_NAME}" --jq .sha)"
          lock_content="$(base64 -w 0 pnpm-lock.yaml)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" \
            -f message='chore(storage): regenerate pnpm lockfile' \
            -f content="$lock_content" \
            -f sha="$lock_sha" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
