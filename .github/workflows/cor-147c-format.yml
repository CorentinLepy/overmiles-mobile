name: COR-147C Format

on:
  push:
    branches:
      - cor-147c-biometric-lock-port
    paths:
      - .github/workflows/cor-147c-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format COR-147C files
        run: pnpm exec prettier src/features/auth/screens/biometric-lock-screen.tsx src/features/auth/screens/profile-account-screen.tsx src/providers/auth-provider.tsx tests/cor-135-auth-flow.test.mjs --write

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/auth/screens/biometric-lock-screen.tsx src/features/auth/screens/profile-account-screen.tsx src/providers/auth-provider.tsx tests/cor-135-auth-flow.test.mjs
          git commit -m "COR-147C — format biometric integration"
          git push origin HEAD:cor-147c-biometric-lock-port
